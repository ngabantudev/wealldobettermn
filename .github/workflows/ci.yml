name: CI

# Gate for every PR into main. AGENTS.md §0.8 ("outlive the author") and
# the 2026-08-06 state-legislature.geojson outage are why this exists:
# `next build` succeeding locally is not proof the site works once
# deployed — that incident's crash only existed one layer further in,
# inside the compiled Cloudflare Worker bundle, and nothing before that
# PR merged ever built or ran that bundle. See LESSONS.md's Build &
# Tooling section for the full writeup.
#
# This workflow does NOT deploy anything. Deploys are Cloudflare Workers
# Builds' own git integration (dashboard-configured, triggered directly
# by pushes — see LESSONS.md's Cloudflare Workers Builds entry). This is
# a separate, deploy-free check whose only job is to fail a PR loudly,
# before merge, if the same class of bug ships again.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke-test:
    name: Build, lint, and Workers-runtime smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # node-version-file, not a hardcoded version: next.config.ts's
      # build-time freshness check (added alongside this workflow, see
      # the same incident above) imports a .ts file directly and relies
      # on Node's native TypeScript type-stripping working *unflagged*.
      # Live-verified against 26.5.0 (the .nvmrc pin); older Node
      # versions may need --experimental-strip-types or may not support
      # this at all. Keep .nvmrc and package.json's "engines" field in
      # sync if this is ever bumped.
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Correctness-critical logic (upsert/merge semantics, roll-call vote
      # mapping, the AGENTS.md §3.2 staleness gate) lives here, not in the
      # build or the smoke test below — neither would notice a regression
      # in this layer as long as the *shape* of the output still builds
      # and the routes still return 200.
      - name: Unit tests (ingest + lib)
        run: |
          npm run test:ingest
          npm run test:lib

      - name: next build (also runs the build-time data-freshness checks in next.config.ts)
        run: npm run build

      - name: Build the actual Cloudflare Worker bundle
        run: npx opennextjs-cloudflare build

      # The whole point of this job: `next build` succeeding says
      # nothing about whether the compiled Worker can serve a request
      # without crashing. Boot the real bundle in workerd (wrangler's
      # default `dev` mode is fully local — no Cloudflare auth or
      # secrets needed, confirmed via `wrangler dev --help`'s
      # `--remote`/`-r` defaulting to false) and hit every static route
      # that's known to exist. Add a new top-level route here when one
      # is added to the app — an unlisted route isn't smoke-tested.
      #
      # Named risk acceptance (AGENTS.md §2.6 landed the `ai` binding):
      # Workers AI has no local emulation at all — `wrangler dev` always
      # tries to open a real remote connection for it, which fails hard
      # in a non-interactive environment with no CLOUDFLARE_API_TOKEN,
      # which this workflow deliberately never sets (see this file's own
      # header: CI has never needed live Cloudflare credentials, and
      # giving it one is a real security-relevant decision, not something
      # to add quietly just to unblock a smoke test). None of the routes
      # smoke-tested below (/, /bills, /meetings) touch the AI binding —
      # only /api/submissions does, and that route isn't smoke-tested
      # here at all yet — so this strips `ai` from a throwaway copy of
      # the real config for this boot only. Accepted gap, stated plainly:
      # this smoke test cannot catch a broken AI-binding *declaration*
      # (wrong binding name, malformed config) — only local dev (an
      # authenticated wrangler session) or an actual deploy would. If
      # /api/submissions is ever added to the smoke-tested route list,
      # this gap needs revisiting, likely via a real scoped
      # CLOUDFLARE_API_TOKEN secret instead of this workaround.
      - name: Smoke test the Worker bundle in a real workerd sandbox
        run: |
          set -e
          node -e "
            const fs = require('fs');
            const raw = fs.readFileSync('wrangler.jsonc', 'utf8');
            const stripped = raw.replace(/\/\/.*\$/gm, '').replace(/\/\*[\s\S]*?\*\//g, '');
            const config = JSON.parse(stripped);
            delete config.ai;
            fs.writeFileSync('wrangler.ci.json', JSON.stringify(config, null, 2));
          "
          npx wrangler dev --config wrangler.ci.json --port 8788 --ip 127.0.0.1 > /tmp/wrangler-dev.log 2>&1 &
          WRANGLER_PID=$!

          cleanup() {
            kill "$WRANGLER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          # Poll instead of a fixed sleep: workerd's boot time varies with
          # runner load, and a fixed sleep either wastes time or flakes.
          READY=0
          for i in $(seq 1 30); do
            if curl -s --max-time 5 -o /dev/null http://127.0.0.1:8788/; then
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            echo "::error::wrangler dev never became reachable on :8788"
            cat /tmp/wrangler-dev.log
            exit 1
          fi

          # `set -e` is intentionally off from here down: a connection-level
          # curl failure (e.g. the worker crashing mid-loop) must fall
          # through to the diagnostics below, not abort the script silently
          # before they print. --max-time/--connect-timeout bound how long
          # a single hung request can block the job.
          set +e
          FAILED=0
          for route in / /bills /meetings; do
            code=$(curl -s --connect-timeout 5 --max-time 10 -o /dev/null -w "%{http_code}" "http://127.0.0.1:8788${route}")
            curl_status=$?
            if [ "$curl_status" -ne 0 ]; then
              echo "::error::${route} — curl failed (exit ${curl_status}), worker likely crashed"
              FAILED=1
            elif [ "$code" != "200" ]; then
              echo "::error::${route} returned HTTP ${code}, expected 200"
              FAILED=1
            else
              echo "${route} -> HTTP ${code}"
            fi
          done
          set -e

          if [ "$FAILED" -ne 0 ]; then
            echo "--- wrangler dev log ---"
            cat /tmp/wrangler-dev.log
            exit 1
          fi
