name: Refresh Minneapolis + St. Paul + Hennepin meetings

# Runs scripts/ingest/legistar.mjs (St. Paul City Council, Hennepin County
# Board) and scripts/ingest/lims-minneapolis.mjs (Minneapolis City Council)
# on a schedule and opens a PR with whatever changed under public/legistar/
# and public/lims/, then merges that PR itself — no human has to click
# anything for the site's "this week" data to stay current.
#
# This workflow did not exist before this fix — the meetings feeds' own
# ingest scripts worked correctly in isolation, but nothing ever ran them
# on a cadence. The result: WardModal.tsx's "this week" sidebar teaser
# rendered whatever 7-day window happened to be current at the moment a
# maintainer last ran `npm run data:legistar` / `npm run data:minneapolis-
# lims` by hand, silently going stale the very next day. src/lib/
# meetingTime.ts's filterMeetingsThisWeek() (added in the same fix as this
# workflow) makes the *display* dynamic against a wider rolling window
# instead of a baked-in one, but that window still needs to actually get
# refreshed periodically for "this week" to have real data in it 30+ days
# out from the last run — this workflow is that missing periodic refresh.
#
# Auto-merges rather than waiting for a human, unlike
# refresh-state-legislature.yml's PR-review pattern — a deliberate
# difference, not an oversight. That workflow's own output (rosters, party-
# unity scores, vacancy counts) is exactly the kind of thing AGENTS.md §0.5
# wants a human eyeballing before it ships: a wrong district join or a
# spurious "vacant" seat is a real, silent-until-reviewed correctness risk.
# This workflow's output is mechanical schedule facts pulled straight from
# each city's own structured API (date/time/location/agenda linkage) with
# no similar judgment call to get wrong, and per this task's own
# motivation, a refresh nobody merges is functionally identical to no
# refresh at all — the "this week" view goes stale again either way. This
# is also why .github/CODEOWNERS scopes code-owner review to
# .github/workflows/ specifically rather than the whole repo: it protects
# the one surface where an unreviewed change is genuinely dangerous
# (a workflow file editing itself to do something else while still running
# with repo secrets) without standing in the way of this file's own
# routine data commits, which never touch a CODEOWNERS-covered path and so
# need zero approvals to merge under current branch protection
# (required_approving_review_count: 0).
#
# Daily cadence, not weekly/monthly like the state-legislature refresh:
# meetings get added, rescheduled, and cancelled on city/county calendars
# far more often than a legislative roster changes, and the whole point of
# this fix is that a resident's "this week" view should reflect reality
# within a day, not linger stale for weeks between manual runs.
on:
  schedule:
    - cron: "0 12 * * *" # daily, 12:00 UTC
  workflow_dispatch: {} # manual "run now" from the Actions tab

# Only one refresh in flight at a time — each run's automation branch is
# timestamped now (so two runs can't collide on the same branch name), but
# two concurrent runs racing to auto-merge would still be two near-
# simultaneous commits to main for the same day's data, which is just
# noise, not a real conflict worth allowing.
concurrency:
  group: refresh-meetings
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Fetch latest meetings/agendas, auto-merge if anything changed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Both scripts already degrade honestly per client/city when a token
      # or key is missing or a fetch fails (LegistarAuthError → per-client
      # empty-state write in legistar.mjs; a missing LIMS_API_KEY leaves
      # the prior committed output untouched in lims-minneapolis.mjs) —
      # neither throws a fatal error the workflow needs to guard against
      # separately. If none of these secrets are configured yet, this step
      # still runs successfully and simply produces no diff below.
      - name: Fetch latest St. Paul + Hennepin (Legistar) meetings/agendas
        env:
          LEGISTAR_TOKEN_STPAUL: ${{ secrets.LEGISTAR_TOKEN_STPAUL }}
          LEGISTAR_TOKEN_HENNEPINMN: ${{ secrets.LEGISTAR_TOKEN_HENNEPINMN }}
          LEGISTAR_TOKEN: ${{ secrets.LEGISTAR_TOKEN }}
        run: npm run data:legistar

      - name: Fetch latest Minneapolis (LIMS) meetings/agendas
        env:
          LIMS_API_KEY: ${{ secrets.LIMS_API_KEY }}
        run: npm run data:minneapolis-lims

      - name: Check whether any meetings output actually changed
        id: diff
        run: |
          if git diff --quiet -- public/legistar/ public/lims/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change under public/legistar/ or public/lims/ — nothing to open a PR for."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize the diff for the PR body
        id: summary
        if: steps.diff.outputs.changed == 'true'
        run: |
          node -e '
            const fs = require("fs");
            const files = [
              ["St. Paul City Council", "public/legistar/stpaul-meetings.json"],
              ["Hennepin County Board", "public/legistar/hennepinmn-meetings.json"],
              ["Minneapolis City Council", "public/lims/minneapolis-meetings.json"],
            ];
            const lines = [];
            for (const [label, file] of files) {
              if (!fs.existsSync(file)) continue;
              const data = JSON.parse(fs.readFileSync(file, "utf8"));
              const statusNote = data.status !== "ingested" ? ` (status: ${data.status} — ${data.note})` : "";
              lines.push(`- **${label}**: ${data.meetings.length} meeting(s), ${data.agendaItems.length} agenda item(s)${statusNote}`);
            }
            fs.writeFileSync(process.env.GITHUB_OUTPUT, `summary<<EOF\n${lines.join("\n")}\nEOF\n`, { flag: "a" });
          '

      # main requires a pull request before merging (branch protection),
      # which blocks a plain `git push` to main from this job's default
      # token regardless of which files changed — that block isn't
      # path-aware. Opening a PR is the only way past it without handing
      # this workflow a standing admin-bypass credential (a Personal
      # Access Token), which would need periodic manual rotation before
      # expiry — reintroducing the exact kind of silent, unattended
      # breakage this whole fix exists to remove. So: open a PR, then
      # immediately merge it ourselves, in the same job, using the same
      # token — no human ever sees or acts on it. It's mergeable with zero
      # approvals because CODEOWNERS only covers .github/workflows/, and
      # this PR never touches that path (required_approving_review_count
      # is 0 repo-wide) — see this file's header comment.
      - name: Open the data-refresh PR and merge it immediately — no review, no waiting
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed as an env var rather than interpolated straight into the
          # shell script below — keeps the shell's own quoting immune to
          # whatever characters ever end up in a future summary line.
          PR_SUMMARY: ${{ steps.summary.outputs.summary }}
        run: |
          set -e
          BRANCH="automation/refresh-meetings-$(date -u +%Y%m%d%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add public/legistar/ public/lims/
          git commit -m "chore(data): refresh meetings/agendas ($(date -u +%Y-%m-%d))"
          git push origin "HEAD:refs/heads/$BRANCH"

          BODY="Automated refresh via scripts/ingest/legistar.mjs and scripts/ingest/lims-minneapolis.mjs (see .github/workflows/refresh-meetings.yml). Auto-merged immediately — no review gate for meetings data (see this workflow's own header comment for why).

          $PR_SUMMARY"

          gh pr create --base main --head "$BRANCH" --title "chore(data): refresh Minneapolis + St. Paul + Hennepin meetings" --body "$BODY"
          gh pr merge "$BRANCH" --squash --delete-branch
